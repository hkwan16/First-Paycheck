# First Paycheck backlog, M0 through M10.
#
# Source: the build plan (docs/plan.md). scripts/sync_backlog.py creates these
# as GitHub issues idempotently with `gh`, keyed by title, assigns the repo
# owner, sets the milestone and labels, sets the Priority and Status fields on
# the GitHub Project, and closes an issue whose status is done.
#
# `status` is todo (the default), in_progress or done. An issue is done only
# when its work is on main and tested. A comment under an issue explains a
# status that is not obvious from its body.
#
# Priorities for M0-M4 come from the plan. The plan gives none for M5-M10, so
# those default to Medium (Low for the stretch item) and are groomed in M4.

milestones:
  M0:
    title: "Scaffold, spec amendments, CI, deployed hello world"
    due_on: 2026-10-22
  M1:
    title: "Data model, auth, Plaid sandbox sync, categorization, design system"
    due_on: 2026-10-26
  M2:
    title: "Upload, ingest, redact, extract, confirm"
    due_on: 2026-10-30
  M3:
    title: "401(k) calculator, decisions, citations, explain, verify"
    due_on: 2026-11-02
  M4:
    title: "Alpha hardening and deliverable"
    due_on: 2026-11-05
  M5:
    title: "Sankey, CSV import, spending summary, recurring detection"
    due_on: 2026-11-12
  M6:
    title: "Emergency fund, goals, health plans, benefits extraction"
    due_on: 2026-11-19
  M7:
    title: "W-4"
    due_on: 2026-11-26
  M8:
    title: "Check-ins, calendar, cash flow, net worth, holdings"
    due_on: 2026-12-03
  M9:
    title: "Plan export"
    due_on: 2026-12-07
  M10:
    title: "Hardening"
    due_on: 2026-12-11

issues:
  # M0: scaffold, spec amendments, CI, deployed hello world
  - title: "Apply spec amendments 1-17 and write the data model spec"
    body: >-
      Edit docs/technical-spec.md in place for amendments 1-17 with a short
      changes list at the end, keeping both Mermaid diagrams valid. Write
      docs/specs/001-data-model.md covering every table, constraint, index, RLS
      exception, the decision versioning rules, the sign convention and
      retention. Done when both files are merged and the diagrams render.
    labels: ["area:docs", "area:data"]
    milestone: M0
    priority: High
  - title: "Move docs into docs/, commit the mockup, write the plan and start the AI log"
    body: >-
      Move the spec, proposal and alpha brief under docs/, commit Mockup B under
      docs/mockup/ with a README, and add docs/plan.md and docs/ai-log.md with
      its first entry. Done when every link in the root README resolves.
    labels: ["area:docs"]
    milestone: M0
    priority: Medium
  - title: "Monorepo scaffold: uv workspace, pnpm web, Makefile, pre-commit, CLAUDE.md files"
    body: >-
      Create the uv workspace (api, evals), web/ with pnpm, the Makefile targets,
      .pre-commit-config.yaml (ruff, mypy, eslint, no-em-dash grep, check-yaml,
      detect-private-key), .env.example, and root and per-package CLAUDE.md.
      Done when `make setup && make test && make lint` pass on a clean clone.
    labels: ["area:infra"]
    milestone: M0
    priority: High
  - title: "FastAPI skeleton with /health, settings, error shape and OpenAPI export"
    body: >-
      Add the app factory, typed settings, one JSON error shape, and
      `python -m app.openapi` writing api/openapi.json. Tests first:
      test_health.py (git SHA and alembic revision in the response) and
      test_boundaries.py (calc isolation, anthropic imported only by the gateway).
      Done when both pass and /health runs locally.
    labels: ["area:api"]
    milestone: M0
    priority: High
  - title: "Alembic wiring and 0001_roles; test conftest creates the auth shim"
    body: >-
      Wire Alembic with revision 0001_roles (role app_api, current_user_id(),
      set_updated_at()) and a test conftest that creates the auth schema shim.
      Tests first: test_migrations.py runs upgrade, downgrade, upgrade. Done
      when it passes and `alembic check` is clean.
    labels: ["area:data", "area:api"]
    milestone: M0
    priority: High
  - title: "Supabase project, app_api role, pooler URLs and JWKS URL in Render and .env"
    body: >-
      Create the hosted Supabase project with asymmetric JWT signing, create
      app_api from the SQL editor, and record the transaction and session pooler
      URLs and the JWKS URL in Render and .env. Done when the deployed API
      connects through the pooler with prepare_threshold=None.
    labels: ["area:infra", "area:data"]
    milestone: M0
    priority: High
  - title: "Next.js scaffold with design tokens, test runners and lint rules"
    body: >-
      Scaffold web/ with the Tailwind v4 @theme token block from the mockup, base
      typography, reduced-motion and reduced-transparency variants, Vitest with
      RTL and MSW, Playwright desktop and phone projects, and ESLint rules banning
      raw hex and status colors outside components/ui. Tests first: tokens.test.ts
      (no raw hex) and a Playwright smoke on /sign-in. Done when both pass in CI.
    labels: ["area:web"]
    milestone: M0
    priority: High
  - title: "CI: lint, migrations, api tests, web unit and build, types drift"
    body: >-
      Add ci.yml with lint (ruff, mypy, eslint, tsc, em-dash grep), migrations
      up/down/up plus `alembic check`, api tests on a Postgres service, web unit
      tests and build, and the types drift check (`make types && git diff
      --exit-code`). Done when a pull request runs every job green.
    labels: ["area:infra"]
    milestone: M0
    priority: High
  - title: "Render Blueprint for API and worker with Dockerfile and deploy hooks"
    body: >-
      Add render.yaml (API web service and worker, shared env group, autoDeploy
      off), the Dockerfile (python:3.12-slim, tesseract-ocr, pango), pre-deploy
      `alembic upgrade head && python -m db.seed.load`, and deploy.yml calling
      the deploy hooks on CI success. Done when merging main deploys /health
      reporting the merged SHA.
    labels: ["area:infra"]
    milestone: M0
    priority: High
  - title: "Vercel project on web/ with env vars and preview deploys"
    body: >-
      Create the Vercel project rooted at web/ with NEXT_PUBLIC_API_URL, the
      Supabase URL and publishable key, and NEXT_PUBLIC_FEATURES, with a preview per
      pull request. Done when production serves the sign-in page with the
      correct tokens.
    labels: ["area:infra", "area:web"]
    milestone: M0
    priority: High
  - title: "GitHub Project, labels, milestones, backlog.yaml and sync_backlog.py"
    body: >-
      Create the GitHub Project with a Priority field, the area labels and
      milestones M0-M10, and scripts/sync_backlog.py that creates the issues in
      this file idempotently with `gh`. Done when the board holds every M0-M4
      issue with status, priority and assignee.
    labels: ["area:infra", "area:docs"]
    milestone: M0
    priority: Medium

  # M1: data model, auth, Plaid sandbox sync, categorization, design system
  - title: "Migration 0002_core with RLS, enums and indexes"
    body: >-
      Create profiles, sync_items, accounts, transactions, balance_snapshots,
      holdings, category_rules, jobs and llm_calls exactly as spec 001 defines
      them, with enable_rls on each. Done when migrations pass up/down/up and
      test_rls_session.py shows user A's rows are invisible to user B.
    labels: ["area:data", "area:api"]
    milestone: M1
    priority: High
  - title: "JWT verification and UserSession"
    body: >-
      Verify Supabase JWTs with PyJWKClient (ES256/RS256, audience
      authenticated) and open one transaction per request that sets the role and
      the JWT claims. Tests first: test_auth.py and test_rls_session.py (role
      reset after the transaction). Done when every route depends on UserSession.
    labels: ["area:api"]
    milestone: M1
    priority: High
  - title: "Route-wide RLS cross-user harness with coverage meta-test"
    body: >-
      Add tests/rls/test_cross_user.py, parametrized over every registered route,
      asserting that user B gets 404 for user A's rows, plus a meta-test that
      fails when a route is not covered. Done when it runs in CI over all M1
      routes.
    labels: ["area:api"]
    milestone: M1
    priority: High
  - title: "Sync provider interface and pipeline with upserts and cursor rules"
    body: >-
      Define the SyncProvider Protocol and pipeline.run_sync (upsert accounts and
      transactions by provider ids, snapshot balances, save the cursor only after
      the last page, enqueue categorize.run and recurring.detect). Tests first:
      sync/test_pipeline.py with a FakeProvider over added, modified and removed
      pages. Done when a rerun is idempotent.
    labels: ["area:api"]
    milestone: M1
    priority: High
  - title: "Plaid client, link token, item exchange, token encryption, sandbox item route"
    body: >-
      Add the Plaid client, POST /sync/link-token, POST /sync/items with Fernet
      token encryption (MultiFernet rotation), and the non-production
      `{sandbox_institution_id}` variant. Tests first: sync/test_crypto.py. Done
      when the sandbox route links First Platypus Bank and queues sync.initial.
    labels: ["area:api"]
    milestone: M1
    priority: High
  - title: "Jobs queue, worker, registry, heartbeat, backoff and GET /jobs/{id}"
    body: >-
      Build the Postgres queue with FOR UPDATE SKIP LOCKED, backoff of
      min(2^attempts * 30 s, 1 h), dead after 5, idempotency keys, heartbeat and
      stale requeue. Tests first: jobs/test_queue.py (no double dispatch,
      backoff, dead after 5, idempotency key). Done when the worker runs a job
      end to end.
    labels: ["area:api"]
    milestone: M1
    priority: High
  - title: "Plaid webhook with signature verification and SECURITY DEFINER enqueue (0006)"
    body: >-
      Verify webhooks by JWT signature and body SHA-256, then call
      enqueue_sync_for_plaid_item from migration 0006_webhook_fn. Tests first:
      sync/test_webhook.py (tampered body, stale iat, wrong kid and HS256 all
      401). Done when a valid webhook queues one incremental sync for the item's
      owner.
    labels: ["area:api", "area:data"]
    milestone: M1
    priority: High
  - title: "Manual sync route POST /sync/items/{id}/sync"
    body: >-
      Queue an incremental sync on demand and return the job id. Done when the
      route is covered by the RLS harness and a local demo refreshes
      transactions without webhooks.
    labels: ["area:api"]
    milestone: M1
    priority: Medium
  - title: "Accounts and transactions routes with filters, pagination and rule writes"
    body: >-
      Add GET /accounts, PATCH /accounts/{id}, GET /transactions (filters and
      cursor pagination) and PATCH /transactions/{id}, which writes a user rule.
      Done when the routes pass the RLS harness and a category fix creates a rule.
    labels: ["area:api"]
    milestone: M1
    priority: High
  - title: "Categorization: normalization, rules precedence, seed CSV, Haiku batching"
    body: >-
      Implement normalize_merchant, the precedence user exact > user prefix >
      seed exact > seed prefix > LLM, about 250 seed rules, Haiku batches of 50
      behind FakeGateway, and the categorize.run job. Tests first:
      sync/test_categorize.py (normalization table, precedence table, only
      unknowns reach the gateway, a fix relabels siblings). Done when all pass.
    labels: ["area:api", "area:data"]
    milestone: M1
    priority: High
  - title: "LLM gateway core, prompt loader, llm_calls ledger and daily budget"
    body: >-
      Build llm/gateway.py with structured outputs, refusal handling, prompt
      files with front matter, an llm_calls row per call, and the per-user daily
      budget check. Tests first: llm/test_gateway.py with respx (refusal raises,
      ledger row written, budget blocks before HTTP, schema error). Done when
      FakeGateway serves every other test.
    labels: ["area:api"]
    milestone: M1
    priority: High
  - title: "Record Plaid sandbox fixtures"
    body: >-
      Write scripts/record_plaid_fixtures.py to capture sandbox responses for
      unit tests, and add the live test_plaid_sandbox.py behind its mark. Done
      when unit tests replay the fixtures with no network.
    labels: ["area:api", "area:evals"]
    milestone: M1
    priority: Medium
  - title: "Web design system, chrome, layouts and /dev/kit gallery"
    body: >-
      Build tone.ts, every components/ui primitive, the chrome, icons, and the
      (auth) and (app) layouts, with a /dev/kit gallery that 404s in production.
      Tests first: Vitest for every ui component and SideNav done marks. Done
      when a Playwright snapshot of /dev/kit at 1280 and 390 matches the mockup
      side by side.
    labels: ["area:web"]
    milestone: M1
    priority: High
  - title: "Web auth: Supabase clients, session refresh, guard and sign-in screen"
    body: >-
      Add browser and server Supabase clients, session refresh middleware, the
      (app) guard, the sign-in screen (password, magic link, sign-up) and
      /auth/callback. Done when a new user can sign up and land in the app on
      production.
    labels: ["area:web"]
    milestone: M1
    priority: High
  - title: "Web data layer: generated types, client, hooks and MSW fixtures"
    body: >-
      Add gen:api and check:api, the bearer middleware, $api, Providers, useJob,
      useDebouncedValue, useCalc, useSaveDecision, setupProgress, typed sample
      fixtures and MSW handlers. Tests first: hooks with MSW and fake timers,
      Money formatting and setupProgress. Done when all pass and check:api runs
      in CI.
    labels: ["area:web"]
    milestone: M1
    priority: High


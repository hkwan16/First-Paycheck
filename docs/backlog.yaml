    labels: ["area:web"]
    milestone: M2
    priority: High

  # M3: 401(k) calculator, decisions, citations, explain, verify
  - title: "Spec 006 401(k) match with hand-worked examples"
    body: >-
      Finish docs/specs/006-401k-match.md with at least six hand-worked examples
      (tiered match, safe harbor, 402(g) cap, 24 vs 26 periods, after-tax cost
      at the marginal rate) and settle its open questions. Done when the spec is
      marked Ready.
    labels: ["area:docs", "area:api"]
    milestone: M3
    priority: High
  - title: "calc/money.py, calc/k401.py, calc/data/2026.json and POST /calc/401k-match"
    body: >-
      Implement the calculator from spec 006 with integer cents, Decimal
      percentages and round_half_up. Tests first: test_k401_examples.py (one per
      spec example), test_k401_properties.py with Hypothesis and test_money.py
      (half-up rounding, no float in calc/). Done when all pass and the route
      returns the spec's outputs.
    labels: ["area:api"]
    milestone: M3
    priority: High
  - title: "Migration 0004_decisions with versioning constraints and immutability trigger"
    body: >-
      Create decisions, goals, calendar_events, explanations and irs_citations as
      spec 001 defines them, including the current_decisions view. Done when
      migrations pass up/down/up and the constraint tests in spec 001 pass.
    labels: ["area:data"]
    milestone: M3
    priority: High
  - title: "POST /decisions, GET /decisions with history, GET /decisions/{id}/explanation"
    body: >-
      Save decisions with supersedes_id, list the current decision per
      calculator with history, and return the latest explanation with
      verification counts. Tests first: integration/test_decisions.py (v2
      supersedes v1, second v2 rejected, UPDATE raises, B cannot supersede A's).
      Done when it passes.
    labels: ["area:api"]
    milestone: M3
    priority: High
  - title: "Seed irs_citations/k401.yaml and retrieval/citations.py"
    body: >-
      Seed the 401(k) passages (402(g) limit, employer match basics, pre-tax
      deferral, vesting, plus the keys spec 006 cites), each verified by hand
      against the live page, and load them by calculator and tax year. Done when
      every citation key the calculator returns resolves to a seeded row.
    labels: ["area:data", "area:api"]
    milestone: M3
    priority: High
  - title: "Explain prompt, verifier with retry and fallback, explain eval suite"
    body: >-
      Add explain prompt v1, the ExplanationDraft schema and POST /explain, with
      the verifier retrying once and then writing a fallback row. Tests first:
      verify/test_numbers.py, verify/test_verify.py and integration/test_explain.py
      (fail once then pass gives two rows; fail twice gives fallback). Done when
      the explain eval reports 100% cited and a fallback rate.
    labels: ["area:api", "area:evals"]
    milestone: M3
    priority: High
  - title: "Web Decisions screen with the 401(k) card and placeholders"
    body: >-
      Build the DecisionCard frame, decisionSaveState, Match401kCard on useCalc
      with a busy state and save with supersedes_id, muted placeholders for the
      other three cards, and the "n of 4 saved" badge. Tests first:
      decisionSaveState transitions and Match401kCard debounce and save. Done
      when saving twice shows v2 on production.
    labels: ["area:web"]
    milestone: M3
    priority: High
  - title: "Web Why screen with verified and fallback layouts"
    body: >-
      Render the explanation response, with the verified and fallback layouts,
      "try again", and a /why index. Tests first: WhyScreen both branches. Done
      when a saved 401(k) decision shows "Verified against calculator" with an
      IRS citation that opens a real page.
    labels: ["area:web"]
    milestone: M3
    priority: High


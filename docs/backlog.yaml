    labels: ["area:api"]
    milestone: M2
    priority: High
  - title: "Synthetic pay stub generator, 10 labeled fixtures and extraction eval"
    body: >-
      Generate 10 labeled stubs (PDF and PNG, some noisy scans), add the
      extraction eval suite and its baseline. Done when field accuracy is at
      least 90% on the 10 fixtures and the baseline is committed on its own.
    labels: ["area:evals"]
    milestone: M2
    priority: High
  - title: "Pin tesseract in the Dockerfile and run ingest tests in the image in CI"
    body: >-
      Pin the Debian tesseract package and add the ingest-in-docker CI job, so
      OCR behaves the same in CI and production. Done when the job is required
      on pull requests.
    labels: ["area:infra"]
    milestone: M2
    priority: Medium
  - title: "Web Link screen with Plaid Link, uploads and job polling"
    body: >-
      Build the accounts list with role select, the documents list,
      LinkBankButton with job polling, uploadDocument with XHR progress,
      extraction polling, footer gating and the e2e sandbox-link button. Tests
      first: LinkScreen polling with fake timers. Done when a sandbox bank and a
      stub can be added on production.
    labels: ["area:web"]
    milestone: M2
    priority: High
  - title: "Web Spending screen, alpha version without the Sankey"

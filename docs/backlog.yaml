    labels: ["area:api"]
    milestone: M2
    priority: High
    status: done
  - title: "Synthetic pay stub generator, 10 labeled fixtures and extraction eval"
    body: >-
      Generate 10 labeled stubs (PDF and PNG, some noisy scans), add the
      extraction eval suite and its baseline. Done when field accuracy is at
      least 90% on the 10 fixtures and the baseline is committed on its own.
    labels: ["area:evals"]
    milestone: M2
    priority: High
    status: done
    # Done October 29 in #144: the extraction suite's first live runs scored
    # field and document accuracy 1.0 over the 30 stubs (target 0.90 on the
    # first 10), and baseline.json holds that measurement.
  - title: "Pin tesseract in the Dockerfile and run ingest tests in the image in CI"
    body: >-
      Pin the Debian tesseract package and add the ingest-in-docker CI job, so

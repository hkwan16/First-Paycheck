    labels: ["area:web"]
    milestone: M2
    priority: High
    status: done

  # M3: 401(k) calculator, decisions, citations, explain, verify
  - title: "Spec 006 401(k) match with hand-worked examples"
    body: >-
      Finish docs/specs/006-401k-match.md with at least six hand-worked examples

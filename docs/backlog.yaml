      stub can be added on production.
    labels: ["area:web"]
    milestone: M2
    priority: High
    status: done
  - title: "Web Spending screen, alpha version without the Sankey"
    body: >-
      Build summary tiles, the transaction table with source badges, the
      category select with an optimistic PATCH, and the "Saved as a rule"

    labels: ["area:web"]
    milestone: M2
    priority: High
    status: done
  - title: "Web Confirm screen with confirmReducer and the arithmetic gate"
    body: >-
      Port the Confirm logic into confirmReducer, with field rows, confidence
      badges, edit and save, confirm-all, progress, the source pane, the 422

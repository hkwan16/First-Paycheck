    status: done
  - title: "calc/money.py, calc/k401.py, calc/data/2026.json and POST /calc/401k-match"
    body: >-
      Implement the calculator from spec 006 with integer cents, Decimal
      percentages and round_half_up. Tests first: test_k401_examples.py (one per

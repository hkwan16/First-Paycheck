      ledger row written, budget blocks before HTTP, schema error). Done when
      FakeGateway serves every other test.
    labels: ["area:api"]
    milestone: M1
    priority: High
    status: done
  - title: "Record Plaid sandbox fixtures"
    body: >-
      Write scripts/record_plaid_fixtures.py to capture sandbox responses for
      unit tests, and add the live test_plaid_sandbox.py behind its mark. Done
      when unit tests replay the fixtures with no network.
    labels: ["area:api", "area:evals"]
    milestone: M1
    priority: Medium
    status: done
  - title: "Web design system, chrome, layouts and /dev/kit gallery"
    body: >-
      Build tone.ts, every components/ui primitive, the chrome, icons, and the
      (auth) and (app) layouts, with a /dev/kit gallery that 404s in production.
      Tests first: Vitest for every ui component and SideNav done marks. Done
      when a Playwright snapshot of /dev/kit at 1280 and 390 matches the mockup
      side by side.
    labels: ["area:web"]
    milestone: M1
    priority: High
    status: done
  - title: "Web auth: Supabase clients, session refresh, guard and sign-in screen"
    body: >-
      Add browser and server Supabase clients, session refresh middleware, the
      (app) guard, the sign-in screen (password, magic link, sign-up) and
      /auth/callback. Done when a new user can sign up and land in the app on
      production.
    labels: ["area:web"]
    milestone: M1
    priority: High
    status: done
  - title: "Web data layer: generated types, client, hooks and MSW fixtures"
    body: >-
      Add gen:api and check:api, the bearer middleware, $api, Providers, useJob,
      useDebouncedValue, useCalc, useSaveDecision, setupProgress, typed sample
      fixtures and MSW handlers. Tests first: hooks with MSW and fake timers,
      Money formatting and setupProgress. Done when all pass and check:api runs
      in CI.
    labels: ["area:web"]
    milestone: M1
    priority: High
    status: done
  - title: "Lock down Supabase's default grants (0007_lock_alembic_version)"
    body: >-
      Supabase grants every new table and function in public to anon and
      authenticated, so alembic_version and three SECURITY DEFINER functions
      were reachable with the publishable key. Make the test auth shim copy
      those defaults so the leak reproduces locally, add
      0007_lock_alembic_version to revoke them and grant back only what each
      function needs, and fail test_migrations on any public object still
      granted to anon. Done when the hosted project's anon probes return 401 and
      the test guards every later migration.
    labels: ["area:data", "area:api"]
    milestone: M1
    priority: High
    status: done

  # M2: upload, ingest, redact, extract, confirm

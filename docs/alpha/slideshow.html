<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>First Paycheck: alpha demo</title>
    <style>
      :root {
        --page: #f6f6f4;
        --card: #ffffff;
        --ink: #1c1b19;
        --muted: #66635d;
        --line: #deddd8;
        --accent: #e8590c;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: var(--page);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 24px;
        border-bottom: 1px solid var(--line);
        background: var(--card);
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      #counter {
        color: var(--muted);
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr) 56px;
        align-items: center;
        gap: 12px;
        padding: 16px 16px 0;
      }
      #stage {
        height: 100%;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stage img,
      #stage video {
        max-width: 100%;
        max-height: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
      }
      .nav {
        width: 48px;
        height: 48px;
        justify-self: center;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--card);
        color: var(--ink);
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
      }
      .nav:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }
      .nav:disabled {
        opacity: 0.35;
        cursor: default;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #caption {
        padding: 14px 24px 4px;
        text-align: center;
      }
      #step {
        margin: 0;
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #title {
        margin: 4px 0 2px;
        font-size: 18px;
        font-weight: 600;
      }
      #detail {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
      #thumbs {
        display: flex;
        justify-content: center;
        gap: 8px;
        padding: 12px 24px 16px;
        overflow-x: auto;
      }
      .thumb {
        flex: 0 0 auto;
        width: 76px;
        height: 42px;
        padding: 0;
        border: 2px solid var(--line);
        border-radius: 5px;
        background: var(--card) center / cover no-repeat;
        color: var(--muted);
        font-size: 16px;
        cursor: pointer;
      }
      .thumb[aria-current="true"] {
        border-color: var(--accent);
      }
      noscript {
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>First Paycheck: alpha demo</h1>
      <span id="counter"></span>
    </header>

    <main>
      <button class="nav" id="prev" type="button" aria-label="Previous slide">&#8592;</button>
      <div id="stage"></div>
      <button class="nav" id="next" type="button" aria-label="Next slide">&#8594;</button>
    </main>

    <section id="caption" aria-live="polite">
      <p id="step"></p>
      <h2 id="title"></h2>
      <p id="detail"></p>
    </section>

    <nav id="thumbs" aria-label="All slides"></nav>

    <noscript>
      This slideshow needs JavaScript. The recording is alpha-demo.mp4 and the screenshots are in
      the screenshots folder beside this page.
    </noscript>

    <script>
      const slides = [
        {
          video: "alpha-demo.mp4",
          step: "Recording",
          title: "The whole path in two minutes",
          detail: "A recording of the deployed app, with a caption naming each step. All data is synthetic.",
        },
        {
          image: "screenshots/01-link-accounts.jpg",
          step: "Step 1: Link a bank",
          title: "Linked bank accounts",
          detail: "The accounts linked through Plaid's sandbox, with their roles and balances.",
        },
        {
          image: "screenshots/02-link-documents.jpg",
          step: "Step 2: Confirm a pay stub",
          title: "Uploaded documents",
          detail: "Each uploaded document, with what was blacked out and where it stands.",
        },
        {
          image: "screenshots/03-confirm-review.jpg",
          step: "Step 2: Confirm a pay stub",
          title: "Confirming a pay stub",
          detail: "Claude's proposed fields beside the redacted source, with the selected field's line outlined.",
        },
        {
          image: "screenshots/04-spending-summary.jpg",
          step: "Step 3: Review spending",
          title: "The month's summary",
          detail: "Income, essentials, flexible spending, and savings for the month.",
        },
        {
          image: "screenshots/05-spending-cash-flow.jpg",
          step: "Step 3: Review spending",
          title: "Cash flow",
          detail: "Where the month's income went, by category.",
        },
        {
          image: "screenshots/06-spending-transactions.jpg",
          step: "Step 3: Review spending",
          title: "Transactions",
          detail: "Each transaction's category and who chose it: a rule, the AI, or the person.",
        },
        {
          image: "screenshots/07-decisions-401k.jpg",
          step: "Step 4: Make the decisions",
          title: "The 401(k) decision",
          detail: "The employer's match, the pay stub's current rate, and the calculator's result.",
        },
        {
          image: "screenshots/08-decisions-w4.jpg",
          step: "Step 4: Make the decisions",
          title: "The W-4 decision",
          detail: "The W-4 step reads the saved 401(k) and health plan decisions.",
        },
        {
          image: "screenshots/09-why-verified.jpg",
          step: "Step 5: Read why",
          title: "A checked explanation",
          detail: "The W-4 explanation, with its numbers checked against the calculator and its IRS sources.",
        },
        {
          image: "screenshots/10-plan.jpg",
          step: "Step 6: Follow the plan",
          title: "The plan",
          detail: "The paycheck, each decision, the exports, and the dates ahead.",
        },
        {
          image: "screenshots/11-check-in-findings.jpg",
          step: "Step 6: Follow the plan",
          title: "What a check-in found",
          detail: "New recurring charges, each with the part of the plan it affects.",
        },
        {
          image: "screenshots/12-check-in-cash-flow.jpg",
          step: "Step 6: Follow the plan",
          title: "Cash flow against the plan",
          detail: "The month's cash flow compared with the plan, and net worth by month.",
        },
      ];

      const stage = document.getElementById("stage");
      const prev = document.getElementById("prev");
      const next = document.getElementById("next");
      const thumbs = document.getElementById("thumbs");
      let current = -1;

      const thumbButtons = slides.map((slide, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "thumb";
        button.setAttribute("aria-label", `Slide ${index + 1}: ${slide.title}`);
        if (slide.image) {
          button.style.backgroundImage = `url("${slide.image}")`;
        } else {
          button.textContent = "▶";
        }
        button.addEventListener("click", () => show(index));
        thumbs.appendChild(button);
        return button;
      });

      function slideFromHash() {
        const number = Number.parseInt(location.hash.slice(1), 10);
        return Number.isInteger(number) && number >= 1 && number <= slides.length ? number - 1 : 0;
      }

      function show(index) {
        if (index < 0 || index >= slides.length || index === current) {
          return;
        }
        current = index;
        const slide = slides[index];

        let media;
        if (slide.video) {
          media = document.createElement("video");
          media.src = slide.video;
          media.controls = true;
          media.preload = "metadata";
        } else {
          media = document.createElement("img");
          media.src = slide.image;
          media.alt = `${slide.title}. ${slide.detail}`;
        }
        stage.replaceChildren(media);

        document.getElementById("counter").textContent = `${index + 1} of ${slides.length}`;
        document.getElementById("step").textContent = slide.step;
        document.getElementById("title").textContent = slide.title;
        document.getElementById("detail").textContent = slide.detail;
        prev.disabled = index === 0;
        next.disabled = index === slides.length - 1;
        thumbButtons.forEach((button, i) => {
          button.setAttribute("aria-current", i === index ? "true" : "false");
        });
        thumbButtons[index].scrollIntoView({ block: "nearest", inline: "nearest" });
        history.replaceState(null, "", `#${index + 1}`);
      }

      prev.addEventListener("click", () => show(current - 1));
      next.addEventListener("click", () => show(current + 1));
      window.addEventListener("hashchange", () => show(slideFromHash()));
      document.addEventListener("keydown", (event) => {
        if (event.target instanceof HTMLVideoElement) {
          return;
        }
        if (event.key === "ArrowRight") {
          show(current + 1);
        } else if (event.key === "ArrowLeft") {
          show(current - 1);
        }
      });

      show(slideFromHash());
    </script>
  </body>
</html>

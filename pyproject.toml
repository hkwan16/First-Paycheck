# uv workspace root. This file is virtual (no [project] table): it holds the
# workspace definition, repo-wide dev tooling and the ruff, mypy, pytest and
# coverage configuration shared by every Python member.

[tool.uv.workspace]
members = ["api", "evals"]

[tool.uv]
# Supply-chain cooldown: resolve only releases that have been public for a week.
exclude-newer = "7 days"

[dependency-groups]
dev = [
  "honcho>=2.0",
  "mypy>=1.15",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pyyaml>=6.0",
  "ruff>=0.11",
  "types-pyyaml>=6.0",
]

# ---------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["web", "docs"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "C4",       # comprehensions
  "DTZ",      # naive datetimes
  "PT",       # pytest style
  "S",        # bandit
  "T20",      # print statements
  "TID",      # tidy imports (banned-api below)
  "RUF",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"anthropic".msg = "Only api/llm/gateway.py may import anthropic."

[tool.ruff.lint.isort]
known-first-party = [
  "app", "calc", "checkin", "db", "evals", "export", "ingest", "jobs",
  "llm", "retrieval", "scripts", "sync", "tests", "verify",
]

[tool.ruff.lint.per-file-ignores]
"api/llm/gateway.py" = ["TID251"]
"**/tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607"]
# CLIs print their results to stdout by design.
"scripts/*.py" = ["T201", "S603", "S607"]
"evals/run.py" = ["T201"]
"api/app/openapi.py" = ["T201"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
mypy_path = "api"
explicit_package_bases = true
files = ["api", "evals", "scripts"]
# Alembic loads migration scripts by path. The directory is named `alembic`
# and would shadow the installed package if mypy treated it as a module.
exclude = ['^api/alembic/']
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
extra_checks = true

# `strict = true` is global-only in mypy, so the strict flag set is spelled
# out for the modules that must be strict (money math, verification, LLM
# schemas, the sync provider interface).
[[tool.mypy.overrides]]
module = ["calc", "calc.*", "verify", "verify.*", "llm.schemas", "sync.provider"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["api/tests", "evals/tests", "scripts/tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "plaid_sandbox: calls the live Plaid sandbox; never part of the default run",
  "llm_live: calls the live Anthropic API; never part of the default run",
]

# ---------------------------------------------------------------- coverage

[tool.coverage.run]
branch = true
omit = ["api/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

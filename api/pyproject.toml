[project]
name = "first-paycheck-api"
version = "0.1.0"
description = "First Paycheck FastAPI backend and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.125",
  "psycopg[binary]>=3.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.7",
  "pyjwt[crypto]>=2.10",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "cryptography>=44",
  "httpx2>=2",
  "python-dotenv>=1.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

# The api directory is the import root: `app`, `db`, `calc`, ... are
# top-level packages, matching `python -m app.openapi`, `python -m jobs.worker`
# and `python -m db.seed.load`. Add each new top-level package here.
[tool.hatch.build.targets.wheel]
packages = ["app", "calc", "db", "jobs", "llm"]

# Alembic configuration. Run from api/: `uv run alembic upgrade head`.
# The database URL comes from DATABASE_URL_PRIVILEGED (see alembic/env.py),
# never from this file.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Revision files are named by their id, e.g. 0002_core.py (`make revision`).
file_template = %%(rev)s
path_separator = os
timezone = UTC

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

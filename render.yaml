# Render Blueprint: one free web service that runs the API and the job worker
# together (api/Dockerfile, `python -m app.serve`).
#
# Why one service: Render's free tier has no background workers and no
# pre-deploy command. app.serve supervises uvicorn and `python -m jobs.worker`
# in one container; migrations and seeds run from CI (deploy.yml) before the
# deploy hook fires. A free instance spins down after 15 idle minutes, so
# .github/workflows/keepalive.yml pings /health every 10 minutes.
#
# Deploys are triggered only by deploy.yml after CI passes on main
# (autoDeploy: false). Secrets are `sync: false`: Render asks for them when the
# Blueprint is first applied and never reads them from this file.

envVarGroups:
  - name: first-paycheck
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # One uvicorn worker: the container also runs the job worker in 512 MB.
      - key: WEB_CONCURRENCY
        value: "1"
      # Supavisor pooler URLs only (Render has no IPv6 egress).
      # app_api role, transaction mode, port 6543.
      - key: DATABASE_URL
        sync: false
      # postgres role, session mode, port 5432 (queue, scheduler).
      - key: DATABASE_URL_PRIVILEGED
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        value: sandbox
      - key: PLAID_WEBHOOK_URL
        value: https://first-paycheck-api.onrender.com/sync/webhook
      - key: PLAID_TOKEN_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_FAKE
        value: "false"
      - key: LLM_MODEL_EXTRACT
        value: claude-sonnet-5-5
      - key: LLM_MODEL_CATEGORIZE
        value: claude-haiku-5-5
      - key: LLM_MODEL_EXPLAIN
        value: claude-sonnet-5-5
      - key: LLM_DAILY_BUDGET_CENTS
        value: "50"

services:
  - type: web
    name: first-paycheck-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    dockerCommand: python -m app.serve
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - fromGroup: first-paycheck

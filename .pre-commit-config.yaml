# Installed by `make setup` (pre-commit install). Run on everything with
# `uv run pre-commit run --all-files`.
#
# Python tools run through `uv run` so their versions come from uv.lock and
# match CI exactly.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: eslint
        name: eslint (web)
        entry: bash -c 'if [ -d web ]; then pnpm --dir web lint; else echo "web/ not found, skipped"; fi'
        language: system
        files: ^web/
        pass_filenames: false

      - id: no-em-dash
        name: no em dash (use a plain dash)
        entry: uv run python scripts/check_no_em_dash.py
        language: system
        types: [text]

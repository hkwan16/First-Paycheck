name: web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'api/openapi.json'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'api/openapi.json'
      - '.github/workflows/web.yml'

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: lint, types, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: API types match api/openapi.json
        run: |
          if [ -f ../api/openapi.json ]; then
            pnpm check:api
          else
            echo "api/openapi.json not found; skipping the types drift check."
          fi

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: playwright smoke
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same image generated the committed *-linux.png baselines, so fonts
    # and rendering match exactly.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium (already in the image; verifies the version)
        run: pnpm exec playwright install chromium

      - run: pnpm e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

name: Keep alive

# Render Free spins the service down after 15 idle minutes and takes about a
# minute to come back, which breaks Plaid webhooks and demos. While the
# instance is up it keeps itself warm (app/keepalive.py requests its own
# /health every 10 minutes); this workflow wakes an instance that did sleep
# after a deploy, a crash or a restart.
#
# GitHub runs schedules when it has capacity, not on time: a single */10 cron
# fired three times in eight hours on November 1 and two to four times a day
# since (issue 197). Two offset schedules ask every 5 minutes, the shortest
# interval GitHub supports, and neither lands on the top of the hour, when
# the queue is longest. One always-on free instance fits in Render's 750 free
# instance hours per month.
on:
  schedule:
    - cron: "3-59/10 * * * *"
    - cron: "8-59/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: ping /health
        run: |
          curl --silent --show-error --max-time 90 --retry 2 \
            https://first-paycheck-api.onrender.com/health || echo "::warning::health ping failed"
